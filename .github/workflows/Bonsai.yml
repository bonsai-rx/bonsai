# =======================================================================================================================================================================
# Bonsai CI Infrastructure
# =======================================================================================================================================================================
name: Bonsai
on:
  push:
    # This prevents tag pushes from triggering this workflow
    branches: ['*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
jobs:
  # =====================================================================================================================================================================
  # Build, test, and package
  # =====================================================================================================================================================================
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Linux x64
            os: ubuntu-22.04
            rid: linux-x64
        configuration: ['debug', 'release']
        include:
          - platform:
              rid: win-x64
            configuration: release
            collect-packages: true
            create-installer: true
    name: ${{matrix.platform.name}} ${{matrix.configuration}}
    runs-on: ${{matrix.platform.os}}
    # Only the target which creates the installer signs anything, so it is the only one which needs the signing credentials and the release approval
    # The condition is spelled out here rather than reusing CiIsForRelease because the environment key is evaluated before any step runs
    environment: ${{matrix.create-installer && github.event_name == 'release' && 'PublicRelease' || ''}}
    steps:
      # ----------------------------------------------------------------------- Checkout
      - name: Checkout
        uses: actions/checkout@v7

      # ----------------------------------------------------------------------- Setup tools
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Setup Python 3.11
        if: matrix.create-installer
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Legacy .NET command line tools are only used for building the installer
      - name: Setup MSBuild command line
        if: matrix.create-installer
        uses: microsoft/setup-msbuild@v3
      - name: Setup NuGet command line
        if: matrix.create-installer
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: 6.x

      # ----------------------------------------------------------------------- Configure build
      - name: Configure build
        uses: bonsai-rx/configure-build@v3

      # ----------------------------------------------------------------------- Build
      - name: Restore
        run: dotnet restore Bonsai.sln

      - name: Build
        run: dotnet build Bonsai.sln --no-restore --configuration ${{matrix.configuration}}

      # ----------------------------------------------------------------------- Repack bootstrapper
      # This happens before pack since the bootstrapper package uses it
      - name: Repack bootstrapper
        if: matrix.create-installer || matrix.collect-packages
        run: dotnet build Bonsai --no-restore --configuration ${{matrix.configuration}} -t:Repack -p:TargetFramework=net48

      # ----------------------------------------------------------------------- Sign bootstrapper
      # Signing here means a single signature covers every copy of the bootstrapper
      - name: Sign bootstrapper
        if: matrix.create-installer && env.CiIsForRelease == 'true'
        uses: bonsai-rx/sign@c8502c075cfa2f3133607b8a6de308347f8beda2 # v1.0.0
        with:
          files: artifacts/bin/Bonsai/${{matrix.configuration}}-repacked/Bonsai.exe
          username: ${{secrets.ES_USERNAME}}
          password: ${{secrets.ES_PASSWORD}}
          credential-id: ${{secrets.ES_CREDENTIAL_ID}}
          totp-secret: ${{secrets.ES_TOTP_SECRET}}

      # ----------------------------------------------------------------------- Pack
      # Since packages are core to Bonsai functionality we always pack them even if they won't be collected
      - name: Pack
        id: pack
        run: dotnet pack Bonsai.sln --no-restore --no-build --configuration ${{matrix.configuration}}

      # ----------------------------------------------------------------------- Test
      - name: Test .NET Framework 4.7.2
        run: dotnet test Bonsai.sln --no-restore --no-build --configuration ${{matrix.configuration}} --verbosity normal --framework net472
      - name: Test .NET 8
        run: dotnet test Bonsai.sln --no-restore --no-build --configuration ${{matrix.configuration}} --verbosity normal --framework net8.0
      - name: Test .NET 8 Windows
        if: matrix.platform.rid == 'win-x64'
        run: dotnet test Bonsai.sln --no-restore --no-build --configuration ${{matrix.configuration}} --verbosity normal --framework net8.0-windows

      # ----------------------------------------------------------------------- Create portable zip
      - name: Create portable zip
        id: create-portable-zip
        if: matrix.create-installer
        run: python .github/workflows/create-portable-zip.py artifacts/Bonsai.zip ${{matrix.configuration}}
        env:
          NUGET_API_URL: ${{vars.NUGET_API_URL}}
          IS_FULL_RELEASE: ${{env.CiIsForRelease}}

      # ----------------------------------------------------------------------- Build setup
      - name: Restore setup
        if: matrix.create-installer
        # Restoring the packages.config directly means we don't rely on the system-wide Wix install
        run: |
          nuget restore Bonsai.Setup/packages.config -SolutionDir .
          nuget restore Bonsai.Setup.Bootstrapper/packages.config -SolutionDir .

      # The MSI and the bundle are built one at a time so the MSI can be signed before the bundle embeds it
      - name: Build MSI
        if: matrix.create-installer
        run: msbuild /nologo /maxCpuCount Bonsai.Setup/Bonsai.Setup.wixproj /p:Configuration=${{matrix.configuration}} /p:Platform=x86

      - name: Sign MSI
        if: matrix.create-installer && env.CiIsForRelease == 'true'
        uses: bonsai-rx/sign@c8502c075cfa2f3133607b8a6de308347f8beda2 # v1.0.0
        with:
          files: artifacts/bin/Bonsai.Setup/${{matrix.configuration}}-x86/Bonsai.Setup.msi
          username: ${{secrets.ES_USERNAME}}
          password: ${{secrets.ES_PASSWORD}}
          credential-id: ${{secrets.ES_CREDENTIAL_ID}}
          totp-secret: ${{secrets.ES_TOTP_SECRET}}

      # Project references are not built so the bundle embeds the MSI produced above instead of relinking it, which would discard its signature
      # The bundle file name carries the version, so it is resolved once here for the signing steps below
      - name: Build installer
        id: create-installer
        if: matrix.create-installer
        run: |
          msbuild /nologo /maxCpuCount Bonsai.Setup.Bootstrapper/Bonsai.Setup.Bootstrapper.wixproj /p:Configuration=${{matrix.configuration}} /p:Platform=x86 /p:BuildProjectReferences=false
          $bundle = Get-Item artifacts/bin/Bonsai.Setup.Bootstrapper/${{matrix.configuration}}-x86/Bonsai-*.exe
          "BundlePath=$($bundle.FullName)" >> $env:GITHUB_ENV

      # ----------------------------------------------------------------------- Sign installer
      # A Burn bundle takes two signatures: the engine is detached from the bundle, signed, and reattached, and only then can the bundle itself be signed
      - name: Detach engine
        if: matrix.create-installer && env.CiIsForRelease == 'true'
        run: packages/wix.3.14.1/tools/insignia.exe -nologo -ib ${{env.BundlePath}} -o artifacts/BundleEngine.exe

      - name: Sign engine
        if: matrix.create-installer && env.CiIsForRelease == 'true'
        uses: bonsai-rx/sign@c8502c075cfa2f3133607b8a6de308347f8beda2 # v1.0.0
        with:
          files: artifacts/BundleEngine.exe
          username: ${{secrets.ES_USERNAME}}
          password: ${{secrets.ES_PASSWORD}}
          credential-id: ${{secrets.ES_CREDENTIAL_ID}}
          totp-secret: ${{secrets.ES_TOTP_SECRET}}

      - name: Reattach engine
        if: matrix.create-installer && env.CiIsForRelease == 'true'
        run: packages/wix.3.14.1/tools/insignia.exe -nologo -ab artifacts/BundleEngine.exe ${{env.BundlePath}} -o ${{env.BundlePath}}

      - name: Sign installer
        if: matrix.create-installer && env.CiIsForRelease == 'true'
        uses: bonsai-rx/sign@c8502c075cfa2f3133607b8a6de308347f8beda2 # v1.0.0
        with:
          files: ${{env.BundlePath}}
          username: ${{secrets.ES_USERNAME}}
          password: ${{secrets.ES_PASSWORD}}
          credential-id: ${{secrets.ES_CREDENTIAL_ID}}
          totp-secret: ${{secrets.ES_TOTP_SECRET}}

      # ----------------------------------------------------------------------- Collect artifacts
      - name: Collect NuGet packages
        uses: actions/upload-artifact@v7
        if: matrix.collect-packages && steps.pack.outcome == 'success' && always()
        with:
          name: Packages
          if-no-files-found: error
          path: artifacts/package/${{matrix.configuration}}/**

      - name: Collect portable zip
        uses: actions/upload-artifact@v7
        if: steps.create-portable-zip.outcome == 'success' && always()
        with:
          name: PortableZip
          if-no-files-found: error
          path: artifacts/Bonsai.zip

      - name: Collect installer
        uses: actions/upload-artifact@v7
        if: steps.create-installer.outcome == 'success' && always()
        with:
          name: Installer
          if-no-files-found: error
          path: artifacts/bin/Bonsai.Setup.Bootstrapper/${{matrix.configuration}}-x86/**

  # =====================================================================================================================================================================
  # Publish to GitHub
  # =====================================================================================================================================================================
  publish-github:
    name: Publish to GitHub
    runs-on: ubuntu-latest
    permissions:
      # Needed to attach files to releases
      contents: write
      # Needed to upload to GitHub Packages
      packages: write
    needs: build-and-test
    # Pushes always publish CI packages (configure-build adds the branch name to the version string for branches besides main)
    # Published releases always publish packages
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      # ----------------------------------------------------------------------- Setup tools
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      # ----------------------------------------------------------------------- Download artifacts
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: Packages

      - name: Download portable zip
        uses: actions/download-artifact@v8
        if: github.event_name == 'release'
        with:
          name: PortableZip

      - name: Download installer
        uses: actions/download-artifact@v8
        if: github.event_name == 'release'
        with:
          name: Installer

      # ----------------------------------------------------------------------- Upload release assets
      - name: Upload release assets
        if: github.event_name == 'release'
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} Bonsai.zip Bonsai-*.exe --clobber
        env:
          GH_TOKEN: ${{github.token}}

      # ----------------------------------------------------------------------- Push to GitHub Packages
      - name: Push to GitHub Packages
        run: dotnet nuget push "Packages/*.nupkg" --skip-duplicate --no-symbols --api-key ${{secrets.GITHUB_TOKEN}} --source https://nuget.pkg.github.com/${{github.repository_owner}}
        env:
          # This is a workaround for https://github.com/NuGet/Home/issues/9775
          DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: 0

  # =====================================================================================================================================================================
  # Publish NuGet Packages to NuGet.org
  # =====================================================================================================================================================================
  publish-packages-nuget-org:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    environment: PublicRelease
    permissions:
      # Needed to request the OIDC token for NuGet.org trusted publishing
      id-token: write
      # Needed to download build artifacts
      contents: read
      actions: read
    # The push to NuGet.org cannot be undone, so we wait until every reversible part of the release has succeeded
    needs: [build-and-test, publish-github]
    # Only release builds publish packages to NuGet.org
    if: github.event_name == 'release'
    steps:
      # ----------------------------------------------------------------------- Setup tools
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      # ----------------------------------------------------------------------- Download artifacts
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: Packages

      # ----------------------------------------------------------------------- Log in to NuGet.org
      # Logging in before the docs update means a misconfigured trusted publishing policy stops the release before anything else moves
      - name: Log in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}}

      # ----------------------------------------------------------------------- Dispatch docs repo update
      # This might seem like an odd spot to do this, but we need access to the PublicRelease environment for our secrets and using it in two jobs means two approvals are needed
      # It runs before the push because the push cannot be undone, so a credential failure here should stop the release rather than strand it half published
      - name: Update version and submodule in ${{vars.DOCS_REPO}}
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: gh workflow run --repo "$DOCS_REPO" version-bump.yml --raw-field "project=$PROJECT" --raw-field "version=$VERSION" --raw-field "project-fork-url=$PROJECT_FORK_URL"
        env:
          GH_TOKEN: ${{secrets.DOCS_UPDATE_GH_TOKEN}}
          DOCS_REPO: ${{vars.DOCS_REPO}}
          PROJECT: bonsai
          VERSION: ${{github.event.release.tag_name}}
          PROJECT_FORK_URL: ${{github.server_url}}/${{github.repository}}.git

      # ----------------------------------------------------------------------- Push to NuGet.org
      # This is the only step of the release which cannot be undone, so it goes last
      - name: Push to NuGet.org
        run: dotnet nuget push "Packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source ${{vars.NUGET_API_URL}}
        env:
          # This is a workaround for https://github.com/NuGet/Home/issues/9775
          DOTNET_SYSTEM_NET_HTTP_USESOCKETSHTTPHANDLER: 0

  # =====================================================================================================================================================================
  # Finish up release
  # =====================================================================================================================================================================
  finish-up-release:
    name: Finish up release
    runs-on: ubuntu-latest
    permissions:
      # Needed to close milestones
      issues: write
    # It's important that this only happens when everything else happened successfully
    # (This is also why this happens as its own job, it lets us ensure both publish paths happened successfully.)
    needs: [publish-github, publish-packages-nuget-org]
    # Only do finishing tasks when we're explicitly releasing
    if: github.event_name == 'release' && github.event.release.prerelease == false
    steps:
      # ----------------------------------------------------------------------- Close milestone
      - name: Close milestone
        uses: actions/github-script@v9
        if: always()
        continue-on-error: true
        env:
          MILESTONE_NAME: ${{github.event.release.tag_name}}
        with:
          user-agent: actions/github-script for ${{github.repository}}
          script: |
            const milestoneToClose = process.env.MILESTONE_NAME;

            response = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            milestones = response.data;

            for (let milestone of milestones) {
              if (milestone.title != milestoneToClose) {
                continue;
              }

              core.info(`Closing milestone '${milestoneToClose}' #${milestone.number}...`);
              await github.rest.issues.updateMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone_number: milestone.number,
                state: 'closed',
              });

              return;
            }

            core.warning(`Could not find any milestone associated with '${milestoneToClose}', the milestone for this release will not be closed.`);
